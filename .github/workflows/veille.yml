name: Mise à jour de la veille

on:
  schedule:
    - cron: "17 */4 * * *"   # toutes les 4 heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire les flux RSS
        run: python scripts/fetch_veille.py veille.json
      - name: Enregistrer s'il y a de nouveaux articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add veille.json
          git diff --cached --quiet && exit 0
          git commit -m "Veille : nouveaux articles"
          git push
